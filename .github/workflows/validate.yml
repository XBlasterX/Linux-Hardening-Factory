name: Linux Hardening CI


on:
  push:
  pull_request:
jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
        - name: Repo download
          uses: actions/checkout@v4

        - name: Python downlad
          uses: actions/setup-python@v5
          with:
            python-version: '3.12'

        - name: pip install and ansible modules
          run: |
                python -m pip install
                pip install ansible-core ansible-lint ansible

        - name: Ansible collection install
          run: |
                ansible-galaxy collection install -r collections/requirements.yml
                ansible-galaxy collection install community.general --upgrade

        - name: Ansible playbook check
          run: |
                ansible-playbook site.yml --syntax-check

        - name: Ansible lint
          run: |
                ansible-lint .

        - name: Python syntax check
          run: |
                python -m py_compile scripts/parse_oscap.py


