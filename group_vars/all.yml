---
# Global configuration variables for Linux Hardening Factory

# Sudo security defaults
sudo_timestamp_timeout: 5
sudo_logfile: "/var/log/sudo.log"

# Compliance assessment defaults
compliance_scan_phase: "{{ scan_phase | default('assessment') }}"
compliance_cis_profile: "xccdf_org.ssgproject.content_profile_cis_server_l1"
compliance_datastream: "/usr/share/xml/scap/ssg/content/ssg-rhel10-ds.xml"
compliance_remote_report_dir: "/var/tmp/oscap"

