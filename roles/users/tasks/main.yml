---
- name: Configure sudo security defaults
  ansible.builtin.copy:
    validate: /usr/sbin/visudo -csf %s
    dest: /etc/sudoers.d/10-security-baseline
    owner: root
    group: root
    mode: "0440"
    content: |
      Defaults use_pty
      Defaults logfile="{{ sudo_logfile | default('/var/log/sudo.log') }}"
      Defaults timestamp_timeout={{ sudo_timestamp_timeout | default(5) }}

- name: Remove legacy separate sudoers timeout configuration if present
  ansible.builtin.file:
    path: /etc/sudoers.d/60-cis-sudo
    state: absent

- name: Validate sudo configuration
  ansible.builtin.command:
    cmd: visudo -cf /etc/sudoers
  changed_when: false
