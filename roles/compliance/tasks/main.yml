---
- name: Create OpenSCAP report directory
  ansible.builtin.file:
    path: "{{ compliance_remote_report_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Run CIS Server Level 1 assessment
  ansible.builtin.command:
    argv:
      - oscap
      - xccdf
      - eval
      - --profile
      - "{{ compliance_cis_profile }}"
      - --results
      - "{{ compliance_remote_report_dir }}/results-{{ compliance_scan_phase }}.xml"
      - --report
      - "{{ compliance_remote_report_dir }}/report-{{ compliance_scan_phase }}.html"
      - "{{ compliance_datastream }}"
  register: compliance_cis_scan
  changed_when: false
  failed_when: compliance_cis_scan.rc not in [0, 2]

- name: Download HTML report to Ansible controller
  ansible.builtin.fetch:
    src: "{{ compliance_remote_report_dir }}/report-{{ compliance_scan_phase }}.html"
    dest: "reports/{{ compliance_scan_phase }}/{{ inventory_hostname }}.html"
    flat: true

- name: Download XML results to Ansible controller
  ansible.builtin.fetch:
    src: "{{ compliance_remote_report_dir }}/results-{{ compliance_scan_phase }}.xml"
    dest: "reports/{{ compliance_scan_phase }}/{{ inventory_hostname }}.xml"
    flat: true
