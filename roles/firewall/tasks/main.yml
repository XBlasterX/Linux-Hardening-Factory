---
- name: Ensure firewalld package is installed
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Ensure firewalld service is enabled and running
  ansible.builtin.systemd_service:
    service: firewalld
    enabled: true
    state: started

- name: Allow SSH service in public zone
  ansible.posix.firewalld:
    service: ssh
    state: enabled
    zone: public
    permanent: true
    immediate: true

- name: Allow HTTP port in public zone
  ansible.posix.firewalld:
    port: 80/tcp
    state: enabled
    zone: public
    permanent: true
    immediate: true

- name: Disable cockpit service in public zone
  ansible.posix.firewalld:
    service: cockpit
    state: disabled
    zone: public
    permanent: true
    immediate: true
