---
- name: Create rollback state directory
  ansible.builtin.file:
    path: /var/lib/ssh-hardening/
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Check whether existing SSH drop-in configuration exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/00-hardening.conf
  register: ssh_hardening_existing_conf

- name: Preview SSH configuration changes
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: '0600'
    owner: root
    group: root
  check_mode: true
  register: ssh_hardening_ssh_config_preview

- name: Backup current SSH drop-in configuration before change
  ansible.builtin.copy:
    remote_src: true
    src: /etc/ssh/sshd_config.d/00-hardening.conf
    dest: /var/lib/ssh-hardening/00-hardening.conf.good
    mode: '0600'
    owner: root
    group: root
  when: ssh_hardening_existing_conf.stat.exists and ssh_hardening_ssh_config_preview.changed

- name: Install rollback script
  ansible.builtin.copy:
    src: ssh-rollback.sh
    dest: /usr/local/sbin/ssh-rollback.sh
    mode: '0700'
    owner: root
    group: root

- name: Schedule SSH rollback  # noqa: no-handler
  ansible.builtin.command:
    argv:
      - systemd-run
      - --unit=ssh-rollback
      - --on-active=180s
      - /usr/local/sbin/ssh-rollback.sh
  when: ssh_hardening_ssh_config_preview.changed
  changed_when: true

- name: Apply hardened SSH configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Reset connection
  ansible.builtin.meta: reset_connection

- name: Verify SSH connectivity
  ansible.builtin.wait_for_connection:
    delay: 3
    timeout: 25

- name: Cancel rollback timer  # noqa: no-handler
  ansible.builtin.systemd:
    name: ssh-rollback.timer
    state: stopped
  when: ssh_hardening_ssh_config_preview.changed
